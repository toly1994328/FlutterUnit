name: Build iOS and Upload to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-unit-ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build signed IPA and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          flutter doctor -v
          xcodebuild -version

      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          full_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
          if [[ ! "$full_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "pubspec version must use X.Y.Z+BUILD format: $full_version" >&2
            exit 1
          fi
          version="${full_version%%+*}"
          build_number="${full_version##*+}"
          echo "full_version=$full_version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "artifact_name=FlutterUnit-$full_version-iOS" >> "$GITHUB_OUTPUT"

      - name: Create release environment
        shell: bash
        env:
          FLUTTER_UNIT_CLIENT_RELEASE_ENV: ${{ secrets.FLUTTER_UNIT_CLIENT_RELEASE_ENV }}
        run: |
          set -euo pipefail
          if [[ -z "$FLUTTER_UNIT_CLIENT_RELEASE_ENV" ]]; then
            echo "Repository Secret FLUTTER_UNIT_CLIENT_RELEASE_ENV is required." >&2
            exit 1
          fi
          environment_directory="$GITHUB_WORKSPACE/../.fx/.env"
          environment_file="$environment_directory/.client.release"
          mkdir -p "$environment_directory"
          printf '%s' "$FLUTTER_UNIT_CLIENT_RELEASE_ENV" > "$environment_file"
          chmod 600 "$environment_file"
          echo "release_env_path=$environment_file" >> "$GITHUB_ENV"

      - name: Import Apple Distribution certificate
        id: certificate
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.FLUTTER_UNIT_IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.FLUTTER_UNIT_IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" ]]; then
            echo "FLUTTER_UNIT_IOS_CERTIFICATE_BASE64 and FLUTTER_UNIT_IOS_CERTIFICATE_PASSWORD are required." >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/flutter-unit-ios-distribution.p12"
          keychain_path="$RUNNER_TEMP/flutter-unit-ios-signing.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"
          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          chmod 600 "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F'"' '/Apple Distribution/ {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "The imported P12 does not contain an Apple Distribution identity." >&2
            exit 1
          fi

          echo "Apple Distribution identity imported."
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "temporary_keychain=$keychain_path" >> "$GITHUB_ENV"
          echo "temporary_certificate=$certificate_path" >> "$GITHUB_ENV"

      - name: Install App Store provisioning profile
        id: profile
        shell: bash
        env:
          PROFILE_BASE64: ${{ secrets.FLUTTER_UNIT_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$PROFILE_BASE64" ]]; then
            echo "Repository Secret FLUTTER_UNIT_IOS_PROVISIONING_PROFILE_BASE64 is required." >&2
            exit 1
          fi

          encoded_profile="$RUNNER_TEMP/flutter-unit.mobileprovision"
          decoded_profile="$RUNNER_TEMP/flutter-unit-profile.plist"
          printf '%s' "$PROFILE_BASE64" | /usr/bin/base64 -D > "$encoded_profile"
          security cms -D -i "$encoded_profile" > "$decoded_profile"

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$decoded_profile")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$decoded_profile")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$decoded_profile")"
          application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$decoded_profile")"
          bundle_identifier="${application_identifier#*.}"

          if [[ "$profile_team" != "V6P5QXUH55" ]]; then
            echo "Provisioning profile team mismatch: $profile_team" >&2
            exit 1
          fi
          if [[ "$bundle_identifier" != "com.toly1994.unit" ]]; then
            echo "Provisioning profile bundle ID mismatch: $bundle_identifier" >&2
            exit 1
          fi

          profiles_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          installed_profile="$profiles_directory/$profile_uuid.mobileprovision"
          mkdir -p "$profiles_directory"
          cp "$encoded_profile" "$installed_profile"

          echo "Provisioning profile installed: $profile_name"
          echo "name=$profile_name" >> "$GITHUB_OUTPUT"
          echo "uuid=$profile_uuid" >> "$GITHUB_OUTPUT"
          echo "temporary_profile=$installed_profile" >> "$GITHUB_ENV"
          echo "temporary_profile_source=$encoded_profile" >> "$GITHUB_ENV"
          echo "temporary_profile_plist=$decoded_profile" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        id: api-key
        shell: bash
        env:
          API_KEY_ID: ${{ secrets.FLUTTER_UNIT_APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.FLUTTER_UNIT_APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.FLUTTER_UNIT_APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$API_KEY_ID" || -z "$API_ISSUER_ID" || -z "$API_PRIVATE_KEY_BASE64" ]]; then
            echo "App Store Connect API key Secrets are required." >&2
            exit 1
          fi

          key_directory="$HOME/.appstoreconnect/private_keys"
          key_path="$key_directory/AuthKey_$API_KEY_ID.p8"
          mkdir -p "$key_directory"
          printf '%s' "$API_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$key_path"
          chmod 600 "$key_path"

          if ! grep -q 'BEGIN PRIVATE KEY' "$key_path"; then
            echo "Decoded App Store Connect API key is invalid." >&2
            exit 1
          fi

          echo "key_id=$API_KEY_ID" >> "$GITHUB_OUTPUT"
          echo "issuer_id=$API_ISSUER_ID" >> "$GITHUB_OUTPUT"
          echo "temporary_api_key=$key_path" >> "$GITHUB_ENV"

      - name: Create App Store export options
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Clear dict' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :teamID string V6P5QXUH55' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.toly1994.unit string $PROFILE_NAME" "$export_options"
          plutil -lint "$export_options"
          echo "export_options_path=$export_options" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get

      - name: Build signed IPA
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ steps.certificate.outputs.identity }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          set -euo pipefail
          flutter build ios \
            --release \
            --no-codesign \
            --obfuscate \
            --split-debug-info="build/ios-symbols/${{ steps.metadata.outputs.full_version }}" \
            --dart-define-from-file="$release_env_path"

          archive_path="$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive"
          export_path="$GITHUB_WORKSPACE/build/ios/ipa"
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=V6P5QXUH55 \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

          mkdir -p "$export_path"
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options_path"

      - name: Verify and package IPA
        id: package
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
          EXPECTED_BUILD: ${{ steps.metadata.outputs.build_number }}
        run: |
          set -euo pipefail
          ipa_count="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')"
          if [[ "$ipa_count" -ne 1 ]]; then
            echo "Expected exactly one IPA, found $ipa_count." >&2
            exit 1
          fi
          ipa_path="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"

          output_directory="$GITHUB_WORKSPACE/build/distribution/ios"
          output_path="$output_directory/FlutterUnit-${{ steps.metadata.outputs.full_version }}.ipa"
          inspect_directory="$RUNNER_TEMP/flutter-unit-ipa-inspect"
          mkdir -p "$output_directory" "$inspect_directory"
          cp "$ipa_path" "$output_path"
          unzip -q "$output_path" 'Payload/*.app/Info.plist' -d "$inspect_directory"
          info_plist="$(find "$inspect_directory/Payload" -maxdepth 2 -name Info.plist -print -quit)"

          bundle_identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_plist")"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")"
          if [[ "$bundle_identifier" != "com.toly1994.unit" || "$version" != "$EXPECTED_VERSION" || "$build" != "$EXPECTED_BUILD" ]]; then
            echo "IPA metadata mismatch: bundle=$bundle_identifier version=$version build=$build" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$inspect_directory/Payload/Runner.app"
          shasum -a 256 "$output_path"
          echo "ipa_path=$output_path" >> "$GITHUB_OUTPUT"

      - name: Upload IPA to TestFlight
        shell: bash
        env:
          API_KEY_ID: ${{ steps.api-key.outputs.key_id }}
          API_ISSUER_ID: ${{ steps.api-key.outputs.issuer_id }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
        run: |
          set -euo pipefail
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"
          echo "IPA accepted by App Store Connect. TestFlight processing continues asynchronously."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}-symbols
          path: build/ios-symbols/${{ steps.metadata.outputs.full_version }}/
          if-no-files-found: error
          retention-days: 30

      - name: Write TestFlight summary
        if: success()
        shell: bash
        run: |
          {
            echo "## FlutterUnit uploaded to TestFlight"
            echo
            echo "- Version: \`${{ steps.metadata.outputs.version }}\`"
            echo "- Build: \`${{ steps.metadata.outputs.build_number }}\`"
            echo "- Bundle ID: \`com.toly1994.unit\`"
            echo "- Status: accepted by App Store Connect; Apple processing is asynchronous"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing materials
        if: always()
        shell: bash
        run: |
          if [[ -n "${temporary_keychain:-}" ]]; then
            security delete-keychain "$temporary_keychain" || true
          fi
          rm -f \
            "${temporary_certificate:-}" \
            "${temporary_profile:-}" \
            "${temporary_profile_source:-}" \
            "${temporary_profile_plist:-}" \
            "${temporary_api_key:-}" \
            "${export_options_path:-}" \
            "${release_env_path:-}"
