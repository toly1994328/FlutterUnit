name: authentication
description: A new Flutter package project.
version: 0.0.1
homepage:
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=1.17.0"
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  file_picker: ^10.1.9
  flutter_bloc: ^8.1.6 # 状态管理
  flutter_svg: ^2.0.17
  equatable: ^2.0.5 # 相等辅助
  shared_preferences: ^2.2.1 # xml 固化
  path_provider: ^2.1.5
  go_router: ^14.2.0
  utils:
    path: ../utils
  fx_updater:
    path: ../fx_updater
  app:
    path: ../app
  l10n:
    path: ../l10n
  components:
    path: ../components
  toly_ui:
    path: ../toly_ui
  unit_env:
    path: ../unit_env
  fx_user_core: 0.0.1
  fx_user_session: 0.0.1
  fx_user_preferences: 0.1.0
  fx_user_http: 0.1.0
  fx_user_ui: 0.0.2
  fx_account: 0.1.1
  fx_exception: 0.0.1+4
  fx_ability: 0.1.0
  sign_in_with_apple: ^6.1.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0

dev_dependencies:
